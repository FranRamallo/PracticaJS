<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
</head>
<body>
    <button id="mostrarPos">Mostrar posición</button>
    <div id="tabla"></div>
    
    <h2>Agregar Nuevo Equipo</h2>
    <form id="nuevoEquipoForm">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre" required><br>
        <label for="puntos">Puntos: </label>
        <input type="number" id="puntos" name="puntos" required><br>
        <label for="pj">Partidos Jugados: </label>
        <input type="number" id="pj" name="pj" required><br>
        <label for="pg">Partidos Ganados: </label>
        <input type="number" id="pg" name="pg" required><br>
        <label for="pe">Partidos Empatados: </label>
        <input type="number" id="pe" name="pe" required><br>
        <label for="pp">Partidos Perdidos: </label>
        <input type="number" id="pp" name="pp" required><br>
        <button type="submit">Agregar Equipo</button>
    </form>

    <script text="text/javascript" src="main.js"></script>
</body>
</html>
